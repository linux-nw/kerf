appId: de.linuxnw.kerf
productName: Kerf
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/tessdata/**
  - package.json
asar: false
npmRebuild: false
win:
  target:
    - nsis
    - zip
  artifactName: Kerf-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  target: dir
