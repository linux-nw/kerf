appId: de.linuxnw.kerf
productName: Kerf
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/tessdata/**
  - build/icon.png
  - package.json
asar: false
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
  artifactName: Kerf-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  icon: build/icon.png
  target: dir
