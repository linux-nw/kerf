appId: de.linuxnw.kerf
productName: Kerf
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - out/main/worker-*.js
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  target:
    - nsis
    - zip
  artifactName: Kerf-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  target: dir
