<!doctype html>
<html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></head>
<body style="margin:0">
<div class="kf-stage">
<div class="kf-tool">
<div class="kf-tool__top"><span class="kf-tool__icon"><svg class="kf-icon kf-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v7M9 7l3 3 3-3M12 21v-7M9 17l3-3 3 3M4 12h16"/></svg></span><span class="kf-kbd">1</span></div>
<p class="kf-tool__title">Komprimieren</p>
<p class="kf-tool__desc">PDF, Bilder und Office-Dateien deutlich kleiner machen.</p>
<div class="kf-tool__formats"><span class="kf-chip">PDF</span><span class="kf-chip">JPG</span><span class="kf-chip">PNG</span><span class="kf-chip">DOCX</span></div>
</div>
<div class="kf-tool is-hover">
<div class="kf-tool__top"><span class="kf-tool__icon"><svg class="kf-icon kf-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13M14 5l3 3-3 3M20 16H7M10 13l-3 3 3 3"/></svg></span><span class="kf-kbd">2</span></div>
<p class="kf-tool__title">Konvertieren</p>
<p class="kf-tool__desc">Von fast jedem Format in fast jedes andere, auch ICO.</p>
<div class="kf-tool__formats"><span class="kf-chip">ICO</span><span class="kf-chip">WEBP</span><span class="kf-chip">HEIC</span><span class="kf-chip">MD</span></div>
</div>
<div class="kf-tool">
<div class="kf-tool__top"><span class="kf-tool__icon"><svg class="kf-icon kf-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h4"/></svg></span><span class="kf-tool__tag">NEU</span></div>
<p class="kf-tool__title">PDF-Werkzeuge</p>
<p class="kf-tool__desc">Zusammenführen, teilen, drehen, schützen, schwärzen.</p>
<div class="kf-tool__formats"><span class="kf-chip">Merge</span><span class="kf-chip">Split</span><span class="kf-chip">OCR</span></div>
</div>
</div>
</body></html>
